<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Pakkeliste — Light Crew</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0C0C12;color:#fff;font-family:'Tahoma',sans-serif;font-weight:bold;max-width:430px;margin:0 auto;padding:16px 12px 100px}
.hdr{padding:12px 0 16px;border-bottom:2px solid #2a2a36;margin-bottom:16px}
.hdr-prod{font-size:14px;color:#888;text-transform:uppercase;letter-spacing:1px}
.hdr-loc{font-size:28px;margin-top:4px}
.hdr-dato{font-size:13px;color:#666;margin-top:4px}
.stats{display:flex;gap:8px;margin-bottom:16px}
.stat{flex:1;background:#1a1a24;border-radius:10px;padding:10px;text-align:center}
.stat-n{font-size:24px}
.stat-l{font-size:10px;color:#666;text-transform:uppercase;margin-top:2px}
.stat-n.grn{color:#4ade80}
.stat-n.red{color:#f87171}
.stat-n.ylw{color:#FBBF24}
.cat{margin-bottom:16px}
.cat-hdr{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1.5px solid #2a2a36;margin-bottom:6px}
.cat-dot{width:12px;height:12px;border-radius:3px}
.cat-name{font-size:16px;text-transform:uppercase;letter-spacing:1px;color:#888}
.grp{margin-bottom:10px}
.item{display:flex;align-items:center;gap:10px;padding:12px;background:#1a1a24;border-radius:10px;margin-bottom:4px;cursor:pointer;-webkit-user-select:none;user-select:none}
.item.main{border-left:4px solid #378ADD;font-size:18px}
.item.acc{margin-left:24px;border-left:3px solid #2a2a36;background:#14141e;padding:10px 12px}
.item.acc .item-name{font-size:14px;color:#aaa}
.item.acc .item-qty{font-size:16px}
.item.ctrl-main{border-left-color:#534AB7}
.item.stand-main{border-left-color:#BA7517}
.item.grip-main{border-left-color:#D85A30}
.chk{width:32px;height:32px;border-radius:8px;border:2.5px solid #555;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;transition:all .15s}
.item.packed .chk{background:#1a3a1a;border-color:#4ade80;color:#4ade80}
.item.missing .chk{background:#3a1a1a;border-color:#f87171;color:#f87171}
.item-info{flex:1;min-width:0}
.item-name{font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item.packed .item-name{color:#4ade80}
.item.missing .item-name{color:#f87171;text-decoration:line-through}
.item-sub{font-size:11px;color:#555;margin-top:1px}
.item-qty{font-size:20px;color:#888;min-width:40px;text-align:right}
.item.packed .item-qty{color:#4ade80}
.sep{height:1px;background:#1a1a24;margin:12px 0}
.btns{position:fixed;bottom:0;left:0;right:0;background:#0C0C12;border-top:1.5px solid #2a2a36;padding:12px 16px env(safe-area-inset-bottom);display:flex;gap:8px;max-width:430px;margin:0 auto}
.btn{flex:1;padding:14px;border-radius:12px;border:none;font-family:'Tahoma',sans-serif;font-size:16px;font-weight:bold;cursor:pointer;text-align:center}
.btn:active{opacity:.8;transform:scale(.97)}
.btn-print{background:#E8820A;color:#fff}
.btn-reset{background:#2a2a36;color:#888}
@media print{
body{background:#fff;color:#000;padding:12px;max-width:100%}
.hdr{border-bottom:2px solid #000}.hdr-prod,.hdr-dato{color:#444}.hdr-loc{color:#000}
.stats,.btns{display:none}
.cat-hdr{border-bottom:1.5px solid #ccc}.cat-name{color:#444}
.item{background:#fff;border:1px solid #ddd}
.item.main{border-left:4px solid #378ADD}
.item.acc{background:#f8f8f8;border-left:3px solid #ccc;margin-left:20px}
.item.acc .item-name{color:#333}
.chk{border:2px solid #000;width:22px;height:22px;font-size:16px}
.item.packed .chk{background:#ddd}.item.missing .chk{background:#fcc}
.item-name{color:#000;font-size:14px}.item.missing .item-name{color:#c00}
.item.packed .item-name{color:#000;text-decoration:none}
.item-sub{color:#666}.item-qty{color:#000}
}
</style>
</head>
<body>

<div class="hdr">
<div class="hdr-prod">Den Lukkede Bog · Studie A</div>
<div class="hdr-loc">Pakkeliste</div>
<div class="hdr-dato" id="dato"></div>
</div>

<div class="stats">
<div class="stat"><div class="stat-n" id="s-total">0</div><div class="stat-l">enheder</div></div>
<div class="stat"><div class="stat-n grn" id="s-pakket">0</div><div class="stat-l">pakket</div></div>
<div class="stat"><div class="stat-n red" id="s-mangler">0</div><div class="stat-l">mangler</div></div>
<div class="stat"><div class="stat-n ylw" id="s-venter">0</div><div class="stat-l">venter</div></div>
</div>

<div id="list"></div>

<div class="btns">
<button class="btn btn-reset" onclick="resetAll()">Nulstil</button>
<button class="btn btn-print" onclick="window.print()">Print pakkeliste</button>
</div>

<script>
var data=[
{cat:'lamp',items:[
  {n:'SkyPanel S60-C',sub:'Arri · 455W · F01',qty:1,acc:[
    {n:'Powercon TRUE1 kabel 10m',qty:1},
    {n:'C-Stand 40" + arm',qty:1},
    {n:'Sandsæk 15kg',qty:1}
  ]},
  {n:'Astera Titan Tube FP1',sub:'Astera · 72W · F02',qty:4,acc:[
    {n:'Titan Tube fabric grid',qty:4},
    {n:'Titan Tube softbox',qty:2},
    {n:'Powercon TRUE1 lader',qty:1},
    {n:'Baby pin adapter',qty:4}
  ]},
  {n:'LS 600d Pro',sub:'Aputure · 600W · F03',qty:1,acc:[
    {n:'Hyper reflector',qty:1},
    {n:'CEE 16A kabel 10m',qty:1},
    {n:'Combo Stand',qty:1},
    {n:'Sandsæk 25kg',qty:1}
  ]},
  {n:'Creamsource Vortex8',sub:'Creamsource · 1200W · F04',qty:1,acc:[
    {n:'DoPchoice Snapbag',qty:1},
    {n:'CEE 32A kabel 25m',qty:1},
    {n:'Junior spigot adapter',qty:1},
    {n:'Combo Stand',qty:1},
    {n:'Sandsæk 25kg',qty:2}
  ]}
]},
{cat:'ctrl',items:[
  {n:'grandMA3 onPC + Node',sub:'MA Lighting · 2 universer',qty:1,acc:[
    {n:'Ethernet kabel 10m',qty:2},
    {n:'5-pin DMX kabel 10m',qty:4},
    {n:'5-pin DMX kabel 5m',qty:4},
    {n:'DMX splitter 1:8',qty:1}
  ]}
]},
{cat:'stand',items:[
  {n:'C-Stand 40" + arm + knuckle',sub:'Avenger',qty:4,acc:[]},
  {n:'Low Boy Roller',sub:'',qty:2,acc:[]},
  {n:'Baby Stand',sub:'',qty:4,acc:[]}
]},
{cat:'grip',items:[
  {n:'Sandsæk 15kg',sub:'Løse (ekstra)',qty:6,acc:[]},
  {n:'4x4 ramme + full diff',sub:'',qty:2,acc:[
    {n:'4x4 silk',qty:1},
    {n:'4x4 neg/floppy',qty:1}
  ]},
  {n:'Mafer tvinger',sub:'',qty:8,acc:[]}
]}
];

var catMeta={lamp:{name:'Lamper',color:'#378ADD'},ctrl:{name:'Styring',color:'#534AB7'},stand:{name:'Stativer',color:'#BA7517'},grip:{name:'Grip',color:'#D85A30'}};
var state=JSON.parse(localStorage.getItem('pk-state2')||'{}');
document.getElementById('dato').textContent=new Date().toLocaleDateString('da-DK',{weekday:'long',day:'numeric',month:'long',year:'numeric'});

function mkItem(key,cls,name,sub,qty){
var s=state[key]||'';
var el=document.createElement('div');
el.className='item '+cls+(s?' '+s:'');
el.innerHTML='<div class="chk">'+(s==='packed'?'✓':s==='missing'?'✗':'')+'</div>'+
'<div class="item-info"><div class="item-name">'+name+'</div>'+(sub?'<div class="item-sub">'+sub+'</div>':'')+'</div>'+
'<div class="item-qty">x'+qty+'</div>';
el.onclick=function(){
if(!s){state[key]='packed'}
else if(s==='packed'){state[key]='missing'}
else{delete state[key]}
localStorage.setItem('pk-state2',JSON.stringify(state));
render();
};
return el;
}

function render(){
var list=document.getElementById('list');
list.innerHTML='';
var total=0,pakket=0,mangler=0;
data.forEach(function(cat){
var m=catMeta[cat.cat];
var catEl=document.createElement('div');
catEl.className='cat';
var hdr=document.createElement('div');
hdr.className='cat-hdr';
hdr.innerHTML='<div class="cat-dot" style="background:'+m.color+'"></div><div class="cat-name">'+m.name+'</div>';
catEl.appendChild(hdr);
cat.items.forEach(function(it,i){
var grp=document.createElement('div');
grp.className='grp';
var mainCls='main'+(cat.cat!=='lamp'?' '+cat.cat+'-main':'');
var key=cat.cat+'-'+i;
grp.appendChild(mkItem(key,mainCls,it.n,it.sub,it.qty));
total++;
var ms=state[key]||'';
if(ms==='packed')pakket++;if(ms==='missing')mangler++;
if(it.acc)it.acc.forEach(function(a,j){
var aKey=key+'-a'+j;
grp.appendChild(mkItem(aKey,'acc',a.n,'',a.qty));
total++;
var as=state[aKey]||'';
if(as==='packed')pakket++;if(as==='missing')mangler++;
});
catEl.appendChild(grp);
});
list.appendChild(catEl);
});
document.getElementById('s-total').textContent=total;
document.getElementById('s-pakket').textContent=pakket;
document.getElementById('s-mangler').textContent=mangler;
document.getElementById('s-venter').textContent=total-pakket-mangler;
}

function resetAll(){
if(!confirm('Nulstil alle afkrydsninger?'))return;
state={};localStorage.setItem('pk-state2',JSON.stringify(state));render();
}
render();
</script>
</body>
</html>

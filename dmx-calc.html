<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>DMX Beregner</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0C0C12;color:#fff;font-family:'Tahoma',sans-serif;font-weight:bold;min-height:100dvh;max-width:430px;margin:0 auto;padding:40px 16px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px}
.title{font-size:16px;color:#555;letter-spacing:1px;text-transform:uppercase}
.inputs{display:flex;gap:12px;align-items:flex-end}
.inp-grp{display:flex;flex-direction:column;align-items:center;gap:4px}
.inp-grp label{font-size:11px;color:#666;text-transform:uppercase;letter-spacing:.5px}
.inp-grp input{background:#1a1a24;border:1.5px solid #2a2a36;border-radius:10px;padding:12px;color:#fff;font-family:'Tahoma',sans-serif;font-size:24px;font-weight:bold;text-align:center;width:120px;outline:none}
.inp-grp input:focus{border-color:#E8820A}
.arrow{font-size:28px;color:#555;padding-bottom:12px}
.result-box{text-align:center;width:100%;padding:24px 16px;background:#1a1a24;border-radius:20px;border:2px solid #E8820A;transition:border-color .3s}
.result-box.warn{border-color:#FBBF24}
.result-box.over{border-color:#f87171}
.r-lbl{font-size:14px;color:#888;text-transform:uppercase;letter-spacing:1px}
.r-addr{font-size:100px;letter-spacing:-3px;line-height:1.1;margin:8px 0;color:#E8820A;transition:color .3s}
.r-addr.warn{color:#FBBF24}
.r-addr.over{color:#f87171}
.r-univ{font-size:18px;color:#378ADD}
.r-warn{font-size:14px;margin-top:8px;padding:8px 12px;border-radius:8px;display:none}
.r-warn.show-warn{display:block;background:rgba(251,191,36,.1);color:#FBBF24}
.r-warn.show-over{display:block;background:rgba(248,113,113,.1);color:#f87171}
.r-free{font-size:13px;color:#555;margin-top:6px}
.btns{display:flex;gap:12px;width:100%;max-width:340px}
.btn{flex:1;border:none;border-radius:16px;padding:18px;color:#fff;font-family:'Tahoma',sans-serif;font-size:22px;font-weight:bold;cursor:pointer;letter-spacing:.5px;text-align:center}
.btn:active{opacity:.8;transform:scale(.97)}
.btn-last{background:#555}
.btn-next{background:#E8820A}
</style>
</head>
<body>

<div class="title">DMX Beregner</div>

<div class="inputs">
<div class="inp-grp">
<label>Start</label>
<input type="number" id="start" value="1" min="1" max="512" oninput="calc()">
</div>
<div class="arrow">+</div>
<div class="inp-grp">
<label>Kanaler</label>
<input type="number" id="ch" value="15" min="1" max="512" oninput="calc()">
</div>
</div>

<div class="result-box" id="resBox">
<div class="r-lbl">Næste startadresse</div>
<div class="r-addr" id="nextAddr">16</div>
<div class="r-univ" id="nextUniv">Univers 1</div>
<div class="r-free" id="freeInfo"></div>
<div class="r-warn" id="warn"></div>
</div>

<div class="btns">
<button class="btn btn-last" onclick="last()">← SIDSTE</button>
<button class="btn btn-next" onclick="next()">NÆSTE →</button>
</div>

<script>
var prevStart=null,prevCh=null;

function calc(){
  var s=parseInt(document.getElementById('start').value)||1;
  var ch=parseInt(document.getElementById('ch').value)||1;
  var n=s+ch;
  var endAddr=s+ch-1;
  var u=Math.ceil(s/512);
  var nextU=Math.ceil(n/512);
  var local=n>512?((n-1)%512)+1:n;
  var free=512-((s-1)%512);
  var box=document.getElementById('resBox');
  var addrEl=document.getElementById('nextAddr');
  var warn=document.getElementById('warn');
  var freeEl=document.getElementById('freeInfo');

  document.getElementById('nextAddr').textContent=n>512?local:n;
  document.getElementById('nextUniv').textContent='Univers '+nextU;
  freeEl.textContent=free+' kanaler ledige i univers '+u;

  box.className='result-box';
  addrEl.className='r-addr';
  warn.className='r-warn';

  if(endAddr>512){
    box.className='result-box over';
    addrEl.className='r-addr over';
    warn.className='r-warn show-over';
    warn.textContent='Overskrider univers '+u+'! Lampen passer ikke — mangler '+(endAddr-512)+' kanaler.';
  } else if(free<30){
    box.className='result-box warn';
    addrEl.className='r-addr warn';
    warn.className='r-warn show-warn';
    warn.textContent='Kun '+free+' kanaler tilbage i univers '+u;
  } else {
    warn.className='r-warn';
  }
}

function next(){
  var s=parseInt(document.getElementById('start').value)||1;
  var ch=parseInt(document.getElementById('ch').value)||1;
  prevStart=s;prevCh=ch;
  var n=s+ch;
  document.getElementById('start').value=n>512?((n-1)%512+1):n;
  calc();
}

function last(){
  if(prevStart===null)return;
  document.getElementById('start').value=prevStart;
  document.getElementById('ch').value=prevCh;
  prevStart=null;prevCh=null;
  calc();
}

calc();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>DMX Adresse-beregner</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0C0C12;color:#fff;font-family:'Tahoma',sans-serif;font-weight:bold;min-height:100dvh;max-width:430px;margin:0 auto;padding:16px 12px env(safe-area-inset-bottom)}
.hdr{text-align:center;margin-bottom:20px}
.hdr h1{font-size:24px;letter-spacing:-.5px}
.hdr .sub{font-size:12px;color:#888;margin-top:4px}
.start-row{display:flex;align-items:center;gap:10px;margin-bottom:16px;background:#1a1a24;border-radius:12px;padding:12px 14px}
.start-row label{font-size:13px;color:#888;white-space:nowrap}
.start-row input{background:#12121a;border:1.5px solid #2a2a36;border-radius:8px;padding:10px;color:#fff;font-family:'Tahoma',sans-serif;font-size:20px;font-weight:bold;text-align:center;width:90px;outline:none}
.start-row input:focus{border-color:#E8820A}
.ubar{margin-bottom:16px}
.ubar-ttl{font-size:11px;color:#888;text-transform:uppercase;letter-spacing:1px;margin-bottom:6px}
.ubar-track{height:14px;background:#1a1a24;border-radius:7px;overflow:hidden;position:relative}
.ubar-fill{height:100%;border-radius:7px;transition:width .3s}
.ubar-lbl{position:absolute;right:6px;top:0;line-height:14px;font-size:10px;color:#fff}
.u1{background:#E8820A}
.u2{background:#378ADD}
.u3{background:#1D9E75}
.list{margin-bottom:16px}
.item{display:flex;align-items:center;gap:8px;padding:10px 12px;background:#1a1a24;border-radius:10px;margin-bottom:6px;border-left:4px solid #E8820A}
.item.u2-border{border-left-color:#378ADD}
.item.u3-border{border-left-color:#1D9E75}
.item .num{font-size:12px;color:#888;min-width:24px}
.item .name{flex:1;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .addr{font-size:14px;color:#E8820A;white-space:nowrap}
.item.u2-border .addr{color:#378ADD}
.item .ch{font-size:12px;color:#888;min-width:36px;text-align:right}
.item .del{width:28px;height:28px;border-radius:50%;border:1px solid #333;background:transparent;color:#666;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.item .del:active{background:#3a1a1a;color:#f87171}
.usplit{text-align:center;font-size:12px;color:#378ADD;padding:6px 0;letter-spacing:1px;text-transform:uppercase;background:rgba(55,138,221,.08);border-radius:8px;margin-bottom:6px}
.add{background:#1a1a24;border-radius:12px;padding:14px;margin-bottom:16px}
.add-row{display:flex;gap:8px;margin-bottom:10px}
.add input{flex:1;background:#12121a;border:1.5px solid #2a2a36;border-radius:8px;padding:10px 12px;color:#fff;font-family:'Tahoma',sans-serif;font-size:16px;font-weight:bold;outline:none}
.add input:focus{border-color:#E8820A}
.add input.ch-inp{width:70px;flex:none;text-align:center}
.add-btn{background:#E8820A;border:none;border-radius:8px;padding:12px;color:#fff;font-family:'Tahoma',sans-serif;font-size:16px;font-weight:bold;cursor:pointer;width:100%}
.add-btn:active{opacity:.8}
.presets{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px}
.preset{padding:8px 12px;border-radius:20px;border:1.5px solid #2a2a36;background:transparent;color:#ccc;font-family:'Tahoma',sans-serif;font-size:12px;font-weight:bold;cursor:pointer;white-space:nowrap}
.preset:active{background:#2a2a36}
.preset .pch{color:#E8820A}
.total{text-align:center;padding:12px;background:#1a1a24;border-radius:12px;margin-bottom:12px}
.total .big{font-size:28px;color:#E8820A}
.total .lbl{font-size:11px;color:#888;margin-top:2px}
</style>
</head>
<body>
<div class="hdr">
<h1>DMX Adresse-beregner</h1>
<div class="sub">Tilføj lamper — se startadresser og universer</div>
</div>

<div class="start-row">
<label>Start ved adresse:</label>
<input type="number" id="startAddr" value="1" min="1" max="512" oninput="render()">
</div>

<div id="ubars"></div>
<div class="total" id="totalBox"><span class="big">0</span> <span class="lbl">kanaler brugt</span></div>
<div id="list" class="list"></div>

<div class="add">
<div class="add-row">
<input type="text" id="addName" placeholder="Lampenavn">
<input type="number" class="ch-inp" id="addCh" placeholder="Ch" min="1" max="512">
</div>
<button class="add-btn" onclick="tilfoej()">+ Tilføj</button>
</div>

<div class="sub" style="font-size:11px;color:#888;margin-bottom:8px;padding:0 4px">HURTIG-PRESETS</div>
<div class="presets" id="presets"></div>

<script>
var fixtures=JSON.parse(localStorage.getItem('dmx-fixtures')||'[]');
var presets=[
  {n:'SkyPanel S60',ch:15},{n:'SkyPanel S30',ch:15},{n:'Orbiter',ch:30},
  {n:'Titan Tube',ch:20},{n:'AX5 TriplePAR',ch:13},{n:'Helios Tube',ch:20},
  {n:'LS 600d Pro',ch:6},{n:'LS 300X',ch:6},{n:'MC',ch:6},
  {n:'Vortex8',ch:23},{n:'Gemini 2x1',ch:8},{n:'Forza 500',ch:4},
  {n:'Celeb 450',ch:4},{n:'Moving Head',ch:23},{n:'Dimmer 1ch',ch:1},
  {n:'Dimmer 6ch',ch:6},{n:'LED Par',ch:7},{n:'Wash 600',ch:16}
];
var pBox=document.getElementById('presets');
presets.forEach(function(p){
  var b=document.createElement('button');
  b.className='preset';
  b.innerHTML=p.n+' <span class="pch">'+p.ch+'ch</span>';
  b.onclick=function(){
    fixtures.push({n:p.n,ch:p.ch});
    gem();render();
  };
  pBox.appendChild(b);
});

function gem(){localStorage.setItem('dmx-fixtures',JSON.stringify(fixtures))}
function render(){
  var start=parseInt(document.getElementById('startAddr').value)||1;
  var list=document.getElementById('list');
  list.innerHTML='';
  var addr=start,totalCh=0,univers={};
  var lastU=Math.ceil(addr/512);
  fixtures.forEach(function(f,i){
    var u=Math.ceil(addr/512);
    var localAddr=((addr-1)%512)+1;
    var endAddr=addr+f.ch-1;
    var endU=Math.ceil(endAddr/512);
    if(!univers[u])univers[u]=0;
    univers[u]+=f.ch;
    if(u!==lastU){
      var sp=document.createElement('div');
      sp.className='usplit';
      sp.textContent='— UNIVERS '+u+' —';
      list.appendChild(sp);
    }
    lastU=endU;
    var el=document.createElement('div');
    el.className='item'+(u>=2?' u2-border':'');
    var endLocal=((endAddr-1)%512)+1;
    el.innerHTML='<span class="num">#'+(i+1)+'</span>'+
      '<span class="name">'+f.n+'</span>'+
      '<span class="addr">U'+u+':'+localAddr+'→'+endLocal+'</span>'+
      '<span class="ch">'+f.ch+'ch</span>'+
      '<button class="del" onclick="slet('+i+')">×</button>';
    list.appendChild(el);
    addr=endAddr+1;
    totalCh+=f.ch;
  });
  // Univers bars
  var ubHTML='';
  var maxU=Math.max(1,Math.ceil((start+totalCh-1)/512));
  for(var u=1;u<=maxU;u++){
    var used=univers[u]||0;
    var pct=Math.min(100,Math.round(used/512*100));
    var cls=u===1?'u1':u===2?'u2':'u3';
    ubHTML+='<div class="ubar"><div class="ubar-ttl">Univers '+u+' — '+used+'/512</div>'+
      '<div class="ubar-track"><div class="ubar-fill '+cls+'" style="width:'+pct+'%"></div>'+
      '<div class="ubar-lbl">'+pct+'%</div></div></div>';
  }
  document.getElementById('ubars').innerHTML=ubHTML;
  document.getElementById('totalBox').innerHTML='<span class="big">'+totalCh+'</span> <span class="lbl">kanaler brugt · '+(addr-1)+' næste ledige</span>';
}
function tilfoej(){
  var n=document.getElementById('addName').value.trim();
  var ch=parseInt(document.getElementById('addCh').value);
  if(!n||!ch||ch<1)return;
  fixtures.push({n:n,ch:ch});
  gem();render();
  document.getElementById('addName').value='';
  document.getElementById('addCh').value='';
  document.getElementById('addName').focus();
}
function slet(i){fixtures.splice(i,1);gem();render()}
document.getElementById('addCh').addEventListener('keydown',function(e){if(e.key==='Enter')tilfoej()});
document.getElementById('addName').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('addCh').focus()});
render();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>DMX Beregner</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0C0C12;color:#fff;font-family:'Tahoma',sans-serif;font-weight:bold;min-height:100dvh;max-width:430px;margin:0 auto;padding:40px 16px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px}
.title{font-size:16px;color:#555;letter-spacing:1px;text-transform:uppercase}
.inputs{display:flex;gap:12px;align-items:flex-end}
.inp-grp{display:flex;flex-direction:column;align-items:center;gap:4px}
.inp-grp label{font-size:11px;color:#666;text-transform:uppercase;letter-spacing:.5px}
.inp-grp input{background:#1a1a24;border:1.5px solid #2a2a36;border-radius:10px;padding:12px;color:#fff;font-family:'Tahoma',sans-serif;font-size:24px;font-weight:bold;text-align:center;width:120px;outline:none}
.inp-grp input:focus{border-color:#E8820A}
.arrow{font-size:28px;color:#555;padding-bottom:12px}
.result-box{text-align:center;width:100%;padding:24px 16px;background:#1a1a24;border-radius:20px;border:2px solid #E8820A}
.r-lbl{font-size:14px;color:#888;text-transform:uppercase;letter-spacing:1px}
.r-addr{font-size:100px;color:#E8820A;letter-spacing:-3px;line-height:1.1;margin:8px 0}
.r-univ{font-size:18px;color:#378ADD}
.next-btn{background:#E8820A;border:none;border-radius:16px;padding:18px 50px;color:#fff;font-family:'Tahoma',sans-serif;font-size:22px;font-weight:bold;cursor:pointer;letter-spacing:.5px}
.next-btn:active{opacity:.8;transform:scale(.97)}
.hist{width:100%;max-width:340px;margin-top:4px}
.hist-ttl{font-size:11px;color:#444;text-transform:uppercase;letter-spacing:1px;margin-bottom:6px}
.hist-list{display:flex;flex-wrap:wrap;gap:6px}
.hist-item{padding:5px 10px;border-radius:6px;background:#1a1a24;font-size:12px;color:#666;cursor:pointer}
.hist-item:active{background:#2a2a36}
.hist-item .ha{color:#E8820A}
</style>
</head>
<body>

<div class="title">DMX Beregner</div>

<div class="inputs">
<div class="inp-grp">
<label>Start</label>
<input type="number" id="start" value="1" min="1" max="512" oninput="calc()">
</div>
<div class="arrow">+</div>
<div class="inp-grp">
<label>Kanaler</label>
<input type="number" id="ch" value="15" min="1" max="512" oninput="calc()">
</div>
</div>

<div class="result-box">
<div class="r-lbl">Næste startadresse</div>
<div class="r-addr" id="nextAddr">16</div>
<div class="r-univ" id="nextUniv">Univers 1</div>
</div>

<div style="display:flex;gap:12px"><button class="next-btn" style="background:#555;flex:1" onclick="last()">← SIDSTE</button><button class="next-btn" style="flex:1" onclick="next()">NÆSTE →</button></div>

<div class="hist" id="histBox" style="display:none">
<div class="hist-ttl">Historik</div>
<div class="hist-list" id="histList"></div>
</div>

<script>
var hist=JSON.parse(localStorage.getItem('dmx-hist2')||'[]');

function calc(){
  var s=parseInt(document.getElementById('start').value)||1;
  var ch=parseInt(document.getElementById('ch').value)||1;
  var n=s+ch;
  var u=Math.ceil(n/512);
  var local=((n-1)%512)+1;
  document.getElementById('nextAddr').textContent=n>512?local:n;
  document.getElementById('nextUniv').textContent='Univers '+u;
}

function next(){
  var s=parseInt(document.getElementById('start').value)||1;
  var ch=parseInt(document.getElementById('ch').value)||1;
  // Gem i historik
  hist.unshift({s:s,ch:ch,n:s+ch});
  if(hist.length>10)hist.pop();
  localStorage.setItem('dmx-hist2',JSON.stringify(hist));
  renderHist();
  // Sæt start til næste adresse — behold antal kanaler
  var n=s+ch;
  document.getElementById('start').value=n>512?((n-1)%512+1):n;
  calc();
}

function renderHist(){
  var box=document.getElementById('histBox');
  var list=document.getElementById('histList');
  if(!hist.length){box.style.display='none';return}
  box.style.display='block';
  list.innerHTML='';
  hist.forEach(function(h){
    var el=document.createElement('div');
    el.className='hist-item';
    el.innerHTML='<span class="ha">'+h.s+'</span>+'+h.ch+'='+h.n;
    el.onclick=function(){
      document.getElementById('start').value=h.s;
      document.getElementById('ch').value=h.ch;
      calc();
    };
    list.appendChild(el);
  });
}
function last(){if(!hist.length)return;var h=hist.shift();localStorage.setItem('dmx-hist2',JSON.stringify(hist));document.getElementById('start').value=h.s;document.getElementById('ch').value=h.ch;calc();renderHist()}
calc();renderHist();
</script>
</body>
</html>
